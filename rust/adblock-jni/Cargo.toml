[package]
name = "adblock_jni"
version = "0.1.0"
edition = "2021"

[lib]
name = "adblock_jni"
crate-type = ["cdylib"]

[dependencies]
adblock = "0.13.5"
jni = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
codegen-units = 1
lto = true
strip = "symbols"
